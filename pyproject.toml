[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-spatial-coordinate-grounder"
version = "0.1.0"
description = "Normalized coordinate converter and bounding-box aligner translating high-level UI instructions into sub-pixel click targets"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-spatial-coordinate-grounder = "agent_spatial_coordinate_grounder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_spatial_coordinate_grounder*"]
